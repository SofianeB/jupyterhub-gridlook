name: Setup
description: Setup Python with compatible virtualenv
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install compatible tooling
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "virtualenv<21.0.0" hatch jupyter-releaser
    - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
    - name: Fix virtualenv compatibility
      shell: bash
      run: python -m pip install "virtualenv<21.0.0"
